name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run mobile:build
      - run: npm run plugin:build
      - run: npm ci --prefix compat/mcp-sdk --ignore-scripts --no-audit --no-fund
      - run: npm run test:mcp
      - run: npm ci --prefix compat/typescript --ignore-scripts --no-audit --no-fund
      - run: npm run test:types
      - run: npm run example:sdk
      - run: npm run check:agent
      - run: node bin/plumbcheck.js run examples/customer-support/safe.json --out reports/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: reports/
          if-no-files-found: ignore
