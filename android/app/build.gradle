plugins { id 'com.android.application' }
android {
    namespace 'com.plumbnote.plumbcheck'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig { applicationId 'com.plumbnote.plumbcheck'; minSdk 26; targetSdk 36; versionCode 6; versionName '0.2.0-preview.5' }
    signingConfigs {
        release {
            if (System.getenv('PLUMBCHECK_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('PLUMBCHECK_ANDROID_KEYSTORE'))
                storePassword System.getenv('PLUMBCHECK_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('PLUMBCHECK_ANDROID_KEY_ALIAS') ?: 'plumbcheck'
                keyPassword System.getenv('PLUMBCHECK_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
