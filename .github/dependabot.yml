version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      ai-sdk: { patterns: ['ai', '@ai-sdk/*'] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /compat/mcp-sdk
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /compat/typescript
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
