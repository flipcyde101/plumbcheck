name: Android
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['android/**', 'mobile/**', 'scripts/build-mobile.mjs', 'src/**', 'package*.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'mobile/**', 'scripts/build-mobile.mjs', 'src/**', 'package*.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 24, cache: npm}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run mobile:build
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PlumbCheck-Android-preview
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
